{
  "name": "Personal integration",
  "true": {
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "pull-requests": "read"
  },
  "env": {
    "GIT_CONFIG_COUNT": 1,
    "GIT_CONFIG_KEY_0": "init.defaultBranch",
    "GIT_CONFIG_VALUE_0": "main"
  },
  "jobs": {
    "quality": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read",
        "pages": "write",
        "id-token": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7"
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": 20,
            "cache": "npm"
          }
        },
        {
          "name": "Configure Pages",
          "id": "pages",
          "uses": "actions/configure-pages@v5",
          "with": {
            "enablement": true
          },
          "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        },
        {
          "name": "Install dependencies",
          "run": "npm ci"
        },
        {
          "name": "Test article publication",
          "run": "node --test $(find tests/article-publication -name '*.test.mjs' ! -name 'ci-workflow.test.mjs' | sort)"
        },
        {
          "name": "Build with Astro",
          "run": "npm run build"
        },
        {
          "name": "Build release artifact",
          "run": "tar -czf pantagruel-research-site.tar.gz -C dist ."
        },
        {
          "name": "Preserve release artifact",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "release-assets",
            "path": "pantagruel-research-site.tar.gz",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Preserve Pages artifact",
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "./dist"
          }
        },
        {
          "name": "Publish quality summary",
          "run": "run_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\ncommit_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\"\n{\n  echo '# Quality'\n  echo\n  echo '| Field | Value |'\n  echo '| --- | --- |'\n  echo '| Result | `passed` |'\n  echo \"| Commit | [\\`$GITHUB_SHA\\`]($commit_url) |\"\n  echo \"| Run | [\\`$GITHUB_RUN_ID\\`]($run_url) |\"\n  echo '| Gates | article tests, Astro build |'\n  echo '| Artifacts | `pantagruel-research-site.tar.gz` |'\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ],
      "name": "Integration",
      "needs": "policy",
      "if": "${{ github.repository == 'pantagruel-alpha/pantagruel-research' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}"
    },
    "deploy": {
      "name": "Deploy Pages",
      "needs": "quality",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Deploy to GitHub Pages",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4"
        }
      ],
      "if": "${{ github.repository == 'pantagruel-alpha/pantagruel-research' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
    },
    "release": {
      "name": "Release",
      "needs": [
        "quality",
        "deploy"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "actions": "read",
        "contents": "write"
      },
      "steps": [
        {
          "name": "Download release artifact",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh run download \"$GITHUB_RUN_ID\" --repo \"$GITHUB_REPOSITORY\" --name release-assets --dir release-assets"
        },
        {
          "name": "Create GitHub release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh release create \"release-$GITHUB_SHA\" release-assets/* --repo \"$GITHUB_REPOSITORY\" --target \"$GITHUB_SHA\" --title \"Pantagruel Research release $GITHUB_SHA\" --generate-notes"
        },
        {
          "name": "Publish release summary",
          "run": "run_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\ncommit_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\"\nrelease_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/release-$GITHUB_SHA\"\n{\n  echo '# Release'\n  echo\n  echo '| Field | Value |'\n  echo '| --- | --- |'\n  echo '| Result | `published` |'\n  echo \"| Release | [\\`release-$GITHUB_SHA\\`]($release_url) |\"\n  echo \"| Commit | [\\`$GITHUB_SHA\\`]($commit_url) |\"\n  echo \"| Run | [\\`$GITHUB_RUN_ID\\`]($run_url) |\"\n  echo '| Assets | `pantagruel-research-site.tar.gz` |'\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ],
      "if": "${{ github.repository == 'pantagruel-alpha/pantagruel-research' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
    },
    "policy": {
      "name": "Personal policy",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Check personal integration policy",
          "run": "python3 .github/personal-ci/gate.py --policy .github/personal-ci/policy.json"
        }
      ],
      "if": "${{ github.repository == 'pantagruel-alpha/pantagruel-research' && (true) }}"
    }
  },
  "on": {
    "pull_request": {
      "branches": [
        "develop",
        "main"
      ]
    },
    "push": {
      "branches": [
        "develop",
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "personal-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": false
  }
}
